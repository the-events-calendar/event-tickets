name: Check spec

on:
  pull_request:
    branches:
      - main
      - 'release/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-spec:
    name: Check spec
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      # Fetch the target branch before running the check.
      - name: Fetch the target origin branch
        run: git fetch origin $GITHUB_BASE_REF
      # Require either a spec change under openspec/ or an `sdd-exception: <reason>` line in the PR description.
      - name: Check spec
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$PR_BODY" =~ sdd-exception:[[:space:]]*([^[:space:]].*) ]]; then
            echo "Spec exception declared: ${BASH_REMATCH[1]}"
            exit 0
          fi

          SPEC_FILES=$(git diff --name-only origin/$GITHUB_BASE_REF HEAD -- openspec/)

          if [[ -n "$SPEC_FILES" ]]; then
            echo "Found spec file(s):"
            echo "$SPEC_FILES"
            exit 0
          fi

          echo "::error::No spec found."
          echo "Add or update a spec under openspec/ for your PR (see /opsx:propose), or add a line to the PR description explaining why one is not needed:"
          echo "sdd-exception: <reason>"
          exit 1
