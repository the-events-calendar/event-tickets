schema: spec-driven

context: |
  Event Tickets: a WordPress plugin (PHP 7.4+, WordPress coding standards enforced by phpcs).
  Standalone RSVP and ticketing for posts and pages, plus Tickets Commerce; pairs with The Events Calendar.
  PHP lives under src/ (TEC namespace), wired through service providers and the tribe() container;
  JS and templates under src/resources and src/views. Shared framework code is the common/ submodule.
  Tests: Codeception (wpunit/integration) run via slic, Jest for JS, Playwright for e2e.
  Every pull request also needs a changelog file (npm run changelog).

