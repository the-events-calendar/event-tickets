entry: "Added the checks a deferred ticket save payload passes before anything
  acts on it: the current user must be able to edit the post, every `update`,
  `delete` and `move` entry must name a ticket on that post, and the existing
  `tribe_tickets_current_user_can_delete_ticket` filter applies to deletions. A
  failed check rejects that entry only. [SOFT-4823]"
