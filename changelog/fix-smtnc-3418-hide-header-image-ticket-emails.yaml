entry: Hid the per-event Ticket Header Image setting in the classic and block
  editors when Tickets Emails is enabled, because Tickets Emails uses the header
  image set under Tickets > Settings > Emails, and the classic editor's Ticket
  Settings panel shows a premium-settings note when it has no settings to show.
