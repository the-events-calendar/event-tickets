significance: minor
type: feature
entry: Added relative sale dates for Tickets Commerce tickets on events, so
  ticket sales and the sale price can start and end a set time before the event
  in both the classic and block editors, and follow the event when its date
  changes. A ticket save whose sales window or sale price window ends before it
  starts, or whose sale price falls outside the sales window, was rejected with
  a message. The discounted filter of the tickets list counted a Tickets
  Commerce sale price saved without dates, and one that starts or ends today.
  The ticket dates and sale price fields of Tickets Commerce tickets on events
  were replaced by the new options, which a theme override of those templates
  does not change. Also kept the Ticket block from saving 1970-01-01 as the date
  of a sale price saved without dates when the ticket is updated.
